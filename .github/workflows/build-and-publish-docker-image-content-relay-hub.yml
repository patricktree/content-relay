name: Build and publish Docker image - `relay-hub`

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  CONTENT_RELAY_PROJECT_NAME: "@content-relay/relay-hub"
  DOCKER_IMAGE_NAME: relay-hub

concurrency:
  group: build-and-publish-relay-hub-docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determine-affected:
    name: Determine if relay-hub is affected
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.relay-hub-affected.outputs.affected }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          # `turbo query affected` needs the compared git refs to exist locally.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.5
        with:
          cache: true
          standalone: true

      - name: Install dependencies and Node.js (via package.json#devEngines.runtime)
        run: |
          node_version=$(jq -r '.devEngines.runtime.version' package.json)
          pnpm runtime set node "${node_version}" -g
          pnpm install --frozen-lockfile

      - name: Determine if relay-hub is affected
        id: relay-hub-affected
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "affected=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          affected_json=$(pnpm exec turbo query affected \
            --tasks turbo:build \
            --packages "${CONTENT_RELAY_PROJECT_NAME}" \
            --base "${{ github.event.before }}" \
            --head "${{ github.sha }}")
          affected_count=$(printf '%s\n' "${affected_json}" | jq '.data.affectedTasks.length')

          if [ "${affected_count}" -gt 0 ]; then
            echo "affected=true" >> "${GITHUB_OUTPUT}"
          else
            echo "affected=false" >> "${GITHUB_OUTPUT}"
          fi

  build-and-publish:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: determine-affected
    if: needs.determine-affected.outputs.affected == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.5
        with:
          cache: true
          standalone: true

      - name: Install dependencies and Node.js (via package.json#devEngines.runtime)
        run: |
          node_version=$(jq -r '.devEngines.runtime.version' package.json)
          pnpm runtime set node "${node_version}" -g
          pnpm install --frozen-lockfile

      - name: Run codebase build
        run: pnpm --filter '${{ env.CONTENT_RELAY_PROJECT_NAME }}' run build

      - name: Create temporary directory for Docker build context
        id: create-docker-build-context-dir
        run: |
          tmpdir=$(mktemp -d)
          echo "docker-build-context-dir=${tmpdir}" >> "${GITHUB_OUTPUT}"

      - name: Create pruned monorepo
        id: create-pruned-monorepo
        run: |
          pnpm exec node ./tooling/create-pruned-monorepo-cli/src/cli.ts \
            --project-name '${{ env.CONTENT_RELAY_PROJECT_NAME }}' \
            --target-dir "${{ steps.create-docker-build-context-dir.outputs.docker-build-context-dir }}"

      - name: Copy Dockerfile to build context
        run: cp ./apps/relay-hub/Dockerfile "${{ steps.create-docker-build-context-dir.outputs.docker-build-context-dir }}/Dockerfile"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Docker image tags
        id: docker-image-tags
        run: |
          image_name="ghcr.io/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}"
          {
            echo "tags<<EOF"
            echo "${image_name}:${{ github.sha }}"
            if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
              echo "${image_name}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Run Docker build and push
        uses: docker/build-push-action@v7.1.0
        with:
          context: "${{ steps.create-docker-build-context-dir.outputs.docker-build-context-dir }}"
          push: true
          tags: ${{ steps.docker-image-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: linux/arm64
