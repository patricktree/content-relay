name: 🏗️ Build `relay-hub` Docker Image

run-name: 🏗️ Build `relay-hub` Docker Image - by ${{ format('@{0}', github.actor) }}

# configure concurrency: cancel pending and in-progress workflow runs if a new commit to the same branch is pushed
# (`github.head_ref` is the source branch of PRs, `github.ref` is the branch for non-PR events, e.g. direct pushes)
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  WORKSPACE_PROJECT_NAME: "@content-relay/relay-hub"
  DOCKER_IMAGE_NAME: relay-hub

jobs:
  build-and-publish-docker-image:
    name: Build and Publish Docker Image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true
          # Affected checks need the compared git refs to exist locally.
          # We fetch a reasonable number of commits to cover typical PRs, while avoiding excessive fetch time and data usage.
          # In case of unusually long-running PRs, if the base commit is not found, we treat the workflow as affected, so the workflow will still work correctly.
          fetch-depth: 100

      - uses: ./.patricktree-stack/.github/actions/bootstrap-repo

      - name: Determine if run is manual dispatch
        id: run-is-manual-dispatch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual=true" >> "${GITHUB_OUTPUT}"
          else
            echo "manual=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Determine if workflow is affected
        id: workflow-is-affected
        if: steps.run-is-manual-dispatch.outputs.manual != 'true'
        run: |
          base_sha="${{ github.event.before }}"
          head_sha="${{ github.sha }}"

          if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            echo "::notice::Base commit ${base_sha} is unavailable; treating workflow as affected."
            echo "affected=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if git diff --quiet "${base_sha}" "${head_sha}" -- \
            .github/workflows/build-and-publish-docker-image-content-relay-hub.yml \
            tooling/create-pruned-monorepo-cli; then
            :
          else
            diff_status=$?
            if [ "${diff_status}" -eq 1 ]; then
              echo "affected=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            exit "${diff_status}"
          fi

          echo "affected=false" >> "${GITHUB_OUTPUT}"

      - name: Determine if project is affected
        id: workspace-project-is-affected
        if: steps.run-is-manual-dispatch.outputs.manual != 'true'
        run: |
          base_sha="${{ github.event.before }}"
          head_sha="${{ github.sha }}"

          affected_json=$(pnpm exec turbo query affected \
            --tasks turbo:build \
            --packages "${WORKSPACE_PROJECT_NAME}" \
            --base "${base_sha}" \
            --head "${head_sha}")
          affected_count=$(printf '%s\n' "${affected_json}" | jq '.data.affectedTasks.length')

          if [ "${affected_count}" -gt 0 ]; then
            echo "affected=true" >> "${GITHUB_OUTPUT}"
          else
            echo "affected=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Determine if build is necessary
        id: build-is-necessary
        env:
          RUN_IS_MANUAL: ${{ steps.run-is-manual-dispatch.outputs.manual }}
          WORKFLOW_IS_AFFECTED: ${{ steps.workflow-is-affected.outputs.affected }}
          WORKSPACE_PROJECT_IS_AFFECTED: ${{ steps.workspace-project-is-affected.outputs.affected }}
        run: |
          if [ "${RUN_IS_MANUAL}" = "true" ] || [ "${WORKFLOW_IS_AFFECTED}" = "true" ] || [ "${WORKSPACE_PROJECT_IS_AFFECTED}" = "true" ]; then
            echo "necessary=true" >> "${GITHUB_OUTPUT}"
          else
            echo "necessary=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run codebase build
        if: steps.build-is-necessary.outputs.necessary == 'true'
        run: pnpm --filter '${{ env.WORKSPACE_PROJECT_NAME }}' run build

      - name: Create temporary directory for Docker build context
        id: create-docker-build-context-dir
        if: steps.build-is-necessary.outputs.necessary == 'true'
        run: |
          tmpdir="${RUNNER_TEMP}/docker-build-context"
          rm -rf "${tmpdir}"
          mkdir -p "${tmpdir}"
          echo "docker-build-context-dir=${tmpdir}" >> "${GITHUB_OUTPUT}"

      - name: Create pruned monorepo and copy Dockerfile to build context
        id: create-pruned-monorepo
        if: steps.build-is-necessary.outputs.necessary == 'true'
        env:
          DOCKER_BUILD_CONTEXT_DIR: ${{ steps.create-docker-build-context-dir.outputs.docker-build-context-dir }}
        run: |
          pnpm exec node ./tooling/create-pruned-monorepo-cli/src/cli.ts \
            --project-name '${{ env.WORKSPACE_PROJECT_NAME }}' \
            --target-dir "${DOCKER_BUILD_CONTEXT_DIR}"
          cp ./apps/relay-hub/Dockerfile "${DOCKER_BUILD_CONTEXT_DIR}/Dockerfile"

      - name: Set up Docker Buildx
        if: steps.build-is-necessary.outputs.necessary == 'true'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        if: steps.build-is-necessary.outputs.necessary == 'true'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Docker image tags
        if: steps.build-is-necessary.outputs.necessary == 'true'
        id: docker-image-tags
        run: |
          image_name="ghcr.io/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}"
          {
            echo "tags<<EOF"
            echo "${image_name}:${{ github.sha }}"
            if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
              echo "${image_name}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Run Docker build and push
        if: steps.build-is-necessary.outputs.necessary == 'true'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: "${{ steps.create-docker-build-context-dir.outputs.docker-build-context-dir }}"
          push: true
          tags: ${{ steps.docker-image-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: linux/arm64
