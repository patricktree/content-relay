packages:
  - apps/*
  - libs/*
  - qa-utils/*
  - tooling/*

allowBuilds:
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: true
  node@runtime:26.4.0: true
  protobufjs: true
  unrs-resolver: true

catalog:
  "@typescript/native-preview": 7.0.0-dev.20260706.1
  "@types/node": ^24
  oxlint: ^1.72.0
  oxlint-tsgolint: ^0.24.0
  hono: ^4.12.27
  typescript: ^6.0.3
  vitest: ^4.1.9

packageExtensions:
  eslint-plugin-react-you-might-not-need-an-effect@1.0.1:
    # "eslint-plugin-react-you-might-not-need-an-effect" defines eslint as peer dependency, but that is not required when used by oxlint --> make it optional
    peerDependenciesMeta:
      eslint:
        optional: true

# handle peer dependencies in a strict way
autoInstallPeers: false
resolvePeersFromWorkspaceRoot: false
strictPeerDependencies: true
dedupePeerDependents: false

# enforce specific Node.js and pnpm version (https://pnpm.io/npmrc#engine-strict)
engineStrict: true

# disable update notifier (https://pnpm.io/npmrc#update-notifier)
updateNotifier: false

# workspace-concurrency=0 will use amount of cores of the host to run tasks concurrently (https://pnpm.io/cli/recursive#--workspace-concurrency)
workspaceConcurrency: 0

minimumReleaseAgeExclude:
  - '@typescript/native-preview-darwin-arm64@7.0.0-dev.20260706.1'
  - '@typescript/native-preview-darwin-x64@7.0.0-dev.20260706.1'
  - '@typescript/native-preview-linux-arm64@7.0.0-dev.20260706.1'
  - '@typescript/native-preview-linux-arm@7.0.0-dev.20260706.1'
  - '@typescript/native-preview-linux-x64@7.0.0-dev.20260706.1'
  - '@typescript/native-preview-win32-arm64@7.0.0-dev.20260706.1'
  - '@typescript/native-preview-win32-x64@7.0.0-dev.20260706.1'
  - '@typescript/native-preview@7.0.0-dev.20260706.1'
